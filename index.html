<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { height:100%; }
  body {
    background:#111;
    font-family: Arial, Helvetica, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    min-height:100dvh;
  }
  .card-container {
    width:100%;
    max-width:700px;
    margin:0 auto 18px auto;
    background:#000;
    opacity:0;
    transform:translateY(30px);
    animation: fadeInUp 0.8s ease forwards;
  }
  .card-container.c2 { animation-delay: 0.25s; }

  @keyframes fadeInUp {
    to { opacity:1; transform:translateY(0); }
  }

  .card {
    position:relative;
    width:100%;
    overflow:hidden;
    border-radius:6px;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }
  .card:hover {
    transform: scale(1.012);
    box-shadow: 0 10px 30px rgba(255,193,7,0.25);
  }
  .card img {
    display:block;
    width:100%;
    height:auto;
  }
  .page1 { padding-top: 84.9609%; }

  .page2-content {
    display:flex;
    flex-direction:column;
    background:#000;
    border-radius:6px;
    overflow:hidden;
    width:100%;
  }
  .p2-title {
    text-align:center;
    font-weight:bold;
    color:#fff;
    font-size:clamp(15px, 4.6vw, 26px);
    letter-spacing:.3px;
    padding:14px 10px;
    background:
      repeating-linear-gradient(135deg, #000 0 14px, #1a1a1a 14px 28px),
      linear-gradient(#000,#000);
    border-bottom:2px solid #eaad00;
  }
  .p2-title .hl { color:#eaad00; }

  .p2-grid {
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.8vw;
    padding: 1.8vw;
  }
  @media (min-width:460px) {
    .p2-grid { gap:12px; padding:12px; }
  }
  .p2-grid .cell {
    background:#000;
    border-radius:8px;
    overflow:hidden;
    aspect-ratio: 163 / 237;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .p2-grid .cell img {
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  .p2-ticker {
    margin: 2vw 3vw;
    border:2px solid #eaad00;
    border-radius:10px;
    background:#000;
    padding:2.6vw 3vw;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap: 1.2vw 3.2vw;
    color:#fff;
    font-weight:bold;
    font-size:clamp(10.5px, 2.9vw, 14px);
  }
  .p2-ticker span::before { content:"\2605  "; color:#eaad00; }

  .p2-footer {
    text-align:center;
    font-weight:bold;
    color:#fff;
    font-size:clamp(11px, 3.2vw, 15px);
    letter-spacing:.3px;
    padding:12px 10px;
    background:
      repeating-linear-gradient(135deg, #000 0 14px, #1a1a1a 14px 28px),
      linear-gradient(#000,#000);
    border-top:2px solid #eaad00;
  }
  .p2-footer .hl { color:#eaad00; }
  .card .bg {
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    object-fit:cover;
  }

  /* Efecto brillo (shine) recorriendo la tarjeta */
  .card::after {
    content:"";
    position:absolute;
    top:0; left:-150%;
    width:60%; height:100%;
    background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.16) 50%, rgba(255,255,255,0) 100%);
    transform: skewX(-20deg);
    animation: shine 6s ease-in-out infinite;
    pointer-events:none;
  }
  .card-container.c2 .card::after { animation-delay: 3s; }

  @keyframes shine {
    0%   { left:-150%; }
    18%  { left:150%; }
    100% { left:150%; }
  }

  .hotspot {
    position:absolute;
    cursor:pointer;
    background:rgba(255,255,255,0);
    border-radius:8px;
    transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
  }
  .hotspot:hover {
    background:rgba(255,255,255,0.10);
    transform: scale(1.03);
  }
  a.hotspot { text-decoration:none; }

  /* Pulso animado sobre el botón de WhatsApp */
  .pulse-ring {
    position:absolute;
    left:2.6%; top:82%;
    width:9%; height:9%;
    border-radius:50%;
    pointer-events:none;
  }
  .pulse-ring::before, .pulse-ring::after {
    content:"";
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    border-radius:50%;
    background: rgba(37,211,102,0.55);
    animation: pulse 2.2s ease-out infinite;
  }
  .pulse-ring::after {
    animation-delay: 1.1s;
  }
  @keyframes pulse {
    0%   { transform:scale(0.9); opacity:0.7; }
    70%  { transform:scale(2.2); opacity:0; }
    100% { transform:scale(2.2); opacity:0; }
  }

  /* Brillo suave intermitente en el botón de Waze */
  .waze-glow {
    position:absolute;
    left:35%; top:79.8%;
    width:19%; height:11%;
    border-radius:10px;
    pointer-events:none;
    box-shadow: 0 0 0 rgba(255,255,255,0);
    animation: wazeGlow 3s ease-in-out infinite;
  }
  @keyframes wazeGlow {
    0%, 100% { box-shadow: 0 0 0px rgba(255,255,255,0); }
    50%      { box-shadow: 0 0 14px rgba(255,255,255,0.55); }
  }
</style>
